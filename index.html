<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Financeiro dos Gustavos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

body{
    background:#F3F4F6;
    color:#111827;
}

header{
    background:#1E3A8A;
    color:white;
    padding:24px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.valor{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.receita{
    color:#10B981;
}

.despesa{
    color:#EF4444;
}

.poupanca{
    color:#2563EB;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1E3A8A;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:.9;
}
</style>
</head>

<body>

<header>
    <h1>Controle Financeiro dos Gustavos</h1>
</header>

<div class="container">

    <div class="grid">

        <div class="card">
            <h3>Receitas</h3>
            <div class="valor receita">€ 0,00</div>
        </div>

        <div class="card">
            <h3>Despesas</h3>
            <div class="valor despesa">€ 0,00</div>
        </div>

        <div class="card">
            <h3>Patrimônio</h3>
            <div class="valor poupanca">€ 0,00</div>
        </div>

    </div>

    <div class="card">
        <h2>Bem-vindo!</h2>
        <br>
        <p>
            Esta é a primeira versão do Controle Financeiro dos Gustavos.
        </p>
        <br>
        <p>
            Em breve teremos:
        </p>

        <ul style="margin-left:20px;margin-top:10px;">
            <li>Receitas</li>
            <li>Despesas</li>
            <li>Metas</li>
            <li>Patrimônio</li>
            <li>Gráficos</li>
            <li>Categorias Inteligentes</li>
        </ul>

        <br>

        <button>
            Novo Lançamento
        </button>

    </div>

</div>

</body>
</html>
