<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro dos Gustavos</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header>

    <div class="logo">

        <h1>Controle Financeiro dos Gustavos</h1>

        <p>
            Organize seu dinheiro de forma inteligente.
        </p>

    </div>

</header>

<main>

    <section class="dashboard">

        <div class="card receita">

            <span>Receitas</span>

            <h2 id="totalReceitas">
                € 0,00
            </h2>

        </div>

        <div class="card despesa">

            <span>Despesas</span>

            <h2 id="totalDespesas">
                € 0,00
            </h2>

        </div>

        <div class="card poupanca">

            <span>Poupança</span>

            <h2 id="totalPoupanca">
                € 0,00
            </h2>

        </div>

        <div class="card saldo">

            <span>Saldo Disponível</span>

            <h2 id="saldoDisponivel">
                € 0,00
            </h2>

        </div>

    </section>

    <section class="novo-lancamento">

        <h2>
            Novo Lançamento
        </h2>

        <div class="campo">

            <label>

                Tipo

            </label>

            <select id="tipo">

                <option value="receita">
                    Receita
                </option>

                <option value="despesa">
                    Despesa
                </option>

                <option value="poupanca">
                    Poupança
                </option>

            </select>

        </div>

        <div class="campo">

            <label>

                Valor (€)

            </label>

            <input
                id="valor"
                type="number"
                step="0.01"
                placeholder="0,00">

        </div>

        <div class="campo">

            <label>

                Descrição

            </label>

            <input
                id="descricao"
                type="text"
                placeholder="Ex.: Lidl, TIM, Salário...">

        </div>

        <div class="campo">

            <label>

                Categoria

            </label>

            <select id="categoria">

            </select>

        </div>

        <div class="campo">

            <label>

                Data

            </label>

            <input
                id="data"
                type="date">

        </div>

        <div class="botoes">

            <button id="btnNovaCategoria">

                Nova Categoria

            </button>

            <button id="btnSalvar">

                Salvar

            </button>

        </div>
    <section class="historico">

        <div class="historico-topo">

            <h2>

                Histórico

            </h2>

            <input
                id="pesquisa"
                type="text"
                placeholder="Pesquisar...">

        </div>

        <div
            id="listaLancamentos"
            class="lista-lancamentos">

            <div class="vazio">

                Nenhum lançamento cadastrado.

            </div>

        </div>

    </section>

</main>

<footer>

    <span>

        Controle Financeiro dos Gustavos • Versão 1.0

    </span>

</footer>

<script src="app.js"></script>

</body>

</html>
    </section>
